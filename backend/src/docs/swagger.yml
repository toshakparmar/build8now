openapi: 3.0.0
info:
  title: Build8Now API
  version: 1.0.0
  description: API documentation for Build8Now assignment
servers:
  - url: http://localhost:4000/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                  enum: [CUSTOMER, INFLUENCER]
      responses:
        '201':
          description: User registered successfully
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
  /shipping/profiles:
    get:
      summary: List shipping profiles
      tags: [Shipping]
      responses:
        '200':
          description: Returns list of profiles
    post:
      summary: Create shipping profile
      tags: [Shipping]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Profile created
  /shipping/profiles/{id}:
    get:
      summary: Get shipping profile details
      tags: [Shipping]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns profile
    put:
      summary: Update shipping profile
      tags: [Shipping]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile updated
    delete:
      summary: Deactivate shipping profile
      tags: [Shipping]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile deactivated
  /shipping/profiles/{id}/rules:
    post:
      summary: Add rule to profile
      tags: [Shipping]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metric:
                  type: string
                calculationType:
                  type: string
                fixedCharge:
                  type: number
      responses:
        '201':
          description: Rule added
  /shipping/calculate:
    post:
      summary: Calculate shipping cost
      tags: [Shipping]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                quantity:
                  type: number
      responses:
        '200':
          description: Returns calculated cost
  /orders:
    get:
      summary: List orders
      tags: [Orders]
      responses:
        '200':
          description: Returns orders
    post:
      summary: Create order
      tags: [Orders]
      responses:
        '201':
          description: Order created
  /orders/{id}/confirm:
    post:
      summary: Confirm order and process loyalty points
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order confirmed
  /orders/{id}/cancel:
    post:
      summary: Cancel order and reverse points
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled
  /orders/{id}/refund:
    post:
      summary: Refund order items and reverse partial points
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Items refunded
